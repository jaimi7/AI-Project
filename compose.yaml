name: reminderly

services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      APP_NAME: ${APP_NAME:-Reminderly API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_V1_PREFIX: /api/v1
      BACKEND_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - reminderly

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - reminderly

  cypress:
    image: cypress/included:15.21.1
    profiles: [e2e]
    working_dir: /e2e
    entrypoint: [cypress]
    command: [run, --config, baseUrl=http://frontend]
    environment:
      CYPRESS_baseUrl: http://frontend
    volumes:
      - ./frontend:/e2e
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - reminderly

networks:
  reminderly:
    driver: bridge
