name: reminderly-dev

services:
  backend:
    build:
      context: ./backend
      target: development
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      APP_NAME: ${APP_NAME:-Reminderly API}
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      BACKEND_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reminderly-dev

  frontend:
    build:
      context: ./frontend
      target: development
    command: [npm, run, dev, --, --host, 0.0.0.0]
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:3000/]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reminderly-dev

volumes:
  frontend_node_modules:

networks:
  reminderly-dev:
    driver: bridge
